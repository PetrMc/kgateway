apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-admin-server
  labels:
    app: mcp-admin-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-admin-server
  template:
    metadata:
      labels:
        app: mcp-admin-server
        app.kubernetes.io/name: mcp-admin-server
    spec:
      containers:
        - name: mcp-admin-server
          image: node:20-alpine
          command: ["npx"]
          args: ["-y", "@modelcontextprotocol/server-everything", "streamableHttp", "--port", "3001"]
          ports:
            - containerPort: 3001
          readinessProbe:
            tcpSocket:
              port: 3001
            periodSeconds: 1
            initialDelaySeconds: 0
            failureThreshold: 60   # give npm time on cold start
          livenessProbe:
            tcpSocket:
              port: 3001
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-admin-server
  labels:
    app: mcp-admin-server
spec:
  selector:
    app: mcp-admin-server
  ports:
    - name: http
      port: 80          # what your Backend references
      targetPort: 3001  # containerPort above
      appProtocol: kgateway.dev/mcp
  type: ClusterIP
