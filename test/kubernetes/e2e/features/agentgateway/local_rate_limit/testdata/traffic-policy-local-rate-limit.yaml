apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: test-gateway
  namespace: kgateway-test
spec:
  gatewayClassName: kgateway
  listeners:
  - name: http
    protocol: HTTP
    port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: test-route
  namespace: kgateway-test
spec:
  parentRefs:
  - name: test-gateway
  hostnames:
  - "test.example.com"
  rules:
  - name: rule0
    backendRefs:
    - name: test-backend
      port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: test-backend
  namespace: kgateway-test
spec:
  selector:
    app: test-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: local-rate-limit-policy
  namespace: kgateway-test
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: test-route
  rateLimit:
    local:
      tokenBucket:
        maxTokens: 10
        tokensPerFill: 2
        fillInterval: 30s
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: test-backend
  namespace: kgateway-test
spec:
  type: Static
  static:
    hosts:
    - host: test-backend.kgateway-test.svc.cluster.local
      port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-backend
  namespace: kgateway-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-backend
  template:
    metadata:
      labels:
        app: test-backend
    spec:
      containers:
      - name: test-backend
        image: nginx:alpine
        ports:
        - containerPort: 8080
        env:
        - name: NGINX_PORT
          value: "8080"
